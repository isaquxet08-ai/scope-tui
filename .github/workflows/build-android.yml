name: Build for Termux (Android aarch64)

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Patch source to bypass audio and fix stdin issue
        run: |
          sed -i 's/let mut picker = scope::picker::Picker::new(.*);/let mut picker = ();/' src/main.rs
          sed -i 's/args.device = picker.run(term);/let _ = picker;/' src/main.rs
          sed -i 's|std::fs::File::open("/dev/stdin")|std::fs::File::open("geometries.raw")|g' src/input/file.rs
          sed -i 's|stdin()|std::fs::File::open("geometries.raw").unwrap()|g' src/input/file.rs
          
      - name: Build with cargo-ndk
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cargo ndk -t arm64-v8a --platform 26 build --release --no-default-features --features "app,file"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scope-tui-android
          path: target/aarch64-linux-android/release/scope-tui
